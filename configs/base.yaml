# Base configuration for visual soft robot learning
# This file contains default hyperparameters

# ============================================================================
# Dataset settings
# ============================================================================
dataset: scr_match_1seg
resolution: 32

# ============================================================================
# Training settings
# ============================================================================
batch_size: 32
epochs: 500
train_val_ratio: 0.80  # 80% training, 20% validation

# Learning rates
lr_encoder: 1.0e-3
lr_decoder: 1.0e-3
lr_dynamics: 1.0e-3

# Weight decay (L2 regularization)
weight_decay_encoder: 1.0e-2
weight_decay_decoder: 1.0e-2
weight_decay_dynamics: 1.0e-2

# Learning rate scheduler
lr_scheduler_factor: 0.2
lr_scheduler_patience: 150

# Warmup settings
n_epochs_warmup: 5
warmup_factor: 0.1

# ============================================================================
# Model architecture
# ============================================================================
use_vae: true
latent_dim: 8
actuation_dim: 2
num_actuation_delays: 1  # Number of delayed actuation states

# Dynamics model type: "koopman" or "harmonic1d" or "harmonic2d_vel" or "harmonic2d_proj"
dynamics_type: koopman
harmonic_prediction_function: symplectic_euler  # "analytical", "euler", "symplectic_euler", "implicit_midpoint"
harmonic_use_nonlinear_forcing: false
harmonic_damping_type: full  # "full" or "rayleigh"
use_linear_control: false
mlp_neurons: 32

# Attention decoder settings
use_attention_decoder: false
attention_downsample_factor: 1
attention_feature_dim: 8
background_token_value: 1.0
gumbel_noise_strength: 0.0

# ============================================================================
# Loss weights
# ============================================================================

# # Option 1: similar to RA-L Paper
# delta_t: 0.02  # 50 Hz
# lam_o: 10.0         # Reconstruction loss weight
# lam_z: 0.1          # Dynamics loss weight
# lam_steady: 0.1   # Steady state loss weight
# lam_attn: 0.01      # Attention consistency loss weight
# lam_beta_start: 0.001
# lam_beta_end: 0.001

# Option 2: Best for Control of 1D harmonic model
delta_t: 0.02  # 50 Hz
lam_o: 1.0         # Reconstruction loss weight
lam_z: 1.0          # Dynamics loss weight
lam_steady: 1.0   # Steady state loss weight
lam_attn: 0.01      # Attention consistency loss weight
lam_beta_start: 0.0001
lam_beta_end: 0.0001



lam_beta_schedule_epochs: 300

# Multi-step training
n_multistep: 1              # Starting value
n_multistep_schedule:       # Progressive schedule
  - [0, 1]                  # Epoch 0-29: 1 step
  - [25, 3]                 # Epoch 30-59: 3 steps  
  - [50, 5]                 # Epoch 60-99: 5 steps
  - [100, 10]               # Epoch 100+: 10 steps


# Attention position loss schedule
lam_attn_pos: [0.01, 0.1]
lam_attn_pos_change_epochs: [0, 5]

# ============================================================================
# Saving settings
# ============================================================================
save_model: true
save_frequency: 25  # Save every N epochs

